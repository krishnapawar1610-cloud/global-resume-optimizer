<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Resume Optimizer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 40px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 120px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 5px; padding: 10px; margin-bottom: 20px; resize: none; font-size: 14px; }
        button { background: #007acc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #005999; }
        .result-box { margin-top: 25px; padding: 15px; background: #252526; border-left: 5px solid #007acc; text-align: left; display: none; border-radius: 0 5px 5px 0; }
        h1 { color: #007acc; margin-bottom: 5px; }
        p.subtitle { color: #888; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Global Resume Optimizer</h1>
    <p class="subtitle">Match your resume with international job descriptions instantly</p>
    
    <label>📋 Paste Your Resume Text:</label>
    <textarea id="resumeInput" placeholder="Paste your skills, experience, and profile history here..."></textarea>
    
    <label>💼 Paste the Job Description:</label>
    <textarea id="jobInput" placeholder="Paste the target job requirements and duties here..."></textarea>
    
    <button onclick="analyzeText()">Scan and Optimize Match Score</button>
    
    <div id="result" class="result-box">
        <h3>📊 Analysis Results:</h3>
        <p id="scoreText"></p>
        <p id="feedbackText"></p>
    </div>
</div>

<script>
function analyzeText() {
    let resume = document.getElementById("resumeInput").value.toLowerCase();
    let job = document.getElementById("jobInput").value.toLowerCase();
    
    if(!resume || !job) {
        alert("Please paste text into both boxes first!");
        return;
    }
    
    // Simple beginner algorithm to find matching words
    let commonKeywords = ['javascript', 'python', 'sql', 'html', 'css', 'developer', 'database', 'git', 'excel'];
    let matched = [];
    
    commonKeywords.forEach(word => {
        if(resume.includes(word) && job.includes(word)) {
            matched.push(word);
        }
    });
    
    let score = Math.floor((matched.length / commonKeywords.length) * 100);
    if (score > 80) score = 85; // Give a baseline realistic score
    if (score < 20 && resume.length > 10) score = 35;
    
    document.getElementById("result").style.display = "block";
    document.getElementById("scoreText").innerHTML = "<strong>Match Score:</strong> " + score + "%";
    document.getElementById("feedbackText").innerHTML = "<strong>Keywords Found in Both:</strong> " + (matched.length > 0 ? matched.join(", ") : "None. Try adding relevant technical skills to your resume!");
}
</script>

</body>
</html>
